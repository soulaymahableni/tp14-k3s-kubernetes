# Nécessite metrics-server (inclus dans K3s) et des requests CPU sur les Pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whoami
  namespace: tp14
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50    # 50 % des requests (20m) = 10m par Pod
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # descente plus rapide qu'avec les 300 s par défaut
