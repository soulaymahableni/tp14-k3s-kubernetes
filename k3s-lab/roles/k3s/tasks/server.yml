# Installation idempotente : "creates" saute la tâche si k3s est déjà là
- name: Installer K3s (server)
  ansible.builtin.shell: >
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server
    --node-ip {{ node_ip }}
    --tls-san {{ node_ip }}
    --flannel-iface {{ k3s_iface }}
    --write-kubeconfig-mode 644
  args:
    creates: /usr/local/bin/k3s

- name: Attendre le jeton du server
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

- name: Lire le jeton
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Mémoriser le jeton pour les agents
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Attendre le kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 120

- name: Lire le kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig

- name: Rapatrier k3s.yaml sur la VM de lab (IP du server au lieu de 127.0.0.1)
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig.content | b64decode | replace('127.0.0.1', node_ip) }}"
    dest: "{{ k3s_kubeconfig_dest }}"
    mode: "0600"
  delegate_to: localhost
  become: false
